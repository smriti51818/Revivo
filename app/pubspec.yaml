name: revivo
description: "Revivo — a time-aware food recovery network (Sell → Rescue → Transform)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Media
  image_picker: ^1.1.2

  # Networking
  http: ^1.2.2

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.1

  # Typography — rounded, friendly grocery-app type
  google_fonts: ^6.2.1
  hugeicons: ^1.1.7
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
